name: 建置並發佈 Quay 映像

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登入 Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: 建置並發佈映像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            quay.io/vincent119/tg_spam_bot:${{ github.sha }}
            quay.io/vincent119/tg_spam_bot:latest
