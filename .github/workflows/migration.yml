name: 版本化資料庫遷移驗證

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:migration-test-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 確認 PostgreSQL 整合測試不會略過
        run: go test -race -count=1 -v ./internal/infra/migration -run '^TestMigrationRunner'
      - name: 全量測試與靜態檢查
        run: |
          go test -p 1 -race -count=1 ./...
          go vet ./...
      - name: 驗證映像封裝
        run: |
          docker build -t tg-spam-migration-ci:test .
          docker run --rm --entrypoint /bin/sh tg-spam-migration-ci:test -c 'test -x /app/tg-spam-bot && test -x /app/tg-spam-migrate && test -f /app/migrations/schema_contract.json && test -f /app/migrations/20261005110000_core_baseline.up.sql'
      - name: 檢查 Compose 設定
        env:
          POSTGRES_PASSWORD: migration-test-only
          DB_APP_USER: tg_spam_app
          DB_APP_PASSWORD: migration-app-test-only
          TELEGRAM_BOT_TOKEN: migration-test-only
          TELEGRAM_WEBHOOK_SECRET: migration-test-only
          CONTENT_HASH_KEY: migration-test-only-at-least-32-characters
        run: |
          docker compose config --quiet
          docker compose config --format json | jq -e '.services.app.depends_on.migrate.condition == "service_completed_successfully"'
